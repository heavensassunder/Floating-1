name: Build Android Debug APK (Fallback)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Export Debug APK (system Gradle)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup system Gradle (CLI)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Debug: gradle/tools info
        run: |
          echo "Gradle on PATH: $(command -v gradle || true)"
          gradle --version || true

      - name: Build debug APK using system Gradle
        run: |
          set -euo pipefail
          if [ -d "./android" ]; then
            cd android
          fi

          echo "Listing current directory:"
          ls -la

          echo "Attempting to build with system Gradle (no wrapper required)"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify Generated APK
        run: |
          echo "Locating built APK files..."
          find . -name "*.apk" -type f -exec ls -lh {} + || true

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: floating-buddy-ai-debug-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error